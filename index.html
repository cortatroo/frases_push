<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Entre Nós - Frases</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <!-- Link para o manifesto PWA -->
  <link rel="manifest" href="manifest.json">
</head>
<body>

  <header>
    <h1>ENTRE NÓS</h1>
    <button id="themeToggle" class="icon-btn"><span class="material-icons">dark_mode</span></button>
  </header>

  <div class="search-container">
    <span class="material-icons search-icon">search</span>
    <input type="text" id="searchInput" placeholder="Search...">
  </div>

  <div class="tabs">
    <button id="tabEdicao" class="tab-btn active">Edição</button>
    <button id="tabPostadas" class="tab-btn">Postadas</button>
  </div>

  <main id="quoteList">
    <!-- As frases aparecerão aqui -->
    <div class="loading">Carregando frases...</div>
  </main>

  <button id="fabAdd" class="fab"><span class="material-icons">add</span></button>

  <nav class="bottom-nav">
    <button class="nav-btn active"><span class="material-icons">format_quote</span><br>Frases</button>
    <button class="nav-btn"><span class="material-icons">settings</span><br>TAG</button>
  </nav>

  <!-- Modal de Cadastro -->
  <div id="addModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <button id="closeModal" class="icon-btn"><span class="material-icons">arrow_back</span></button>
        <h2>Cadastro frases</h2>
      </div>
      <div class="modal-body">
        <label>Author (Opcional)</label>
        <input type="text" id="inputAuthor" placeholder="Opcional">
        
        <span class="material-icons share-icon">share</span>
        
        <label>Quote</label>
        <textarea id="inputQuote" placeholder="Insira sua frase aqui." rows="4"></textarea>
        
        <label>Tag</label>
        <input type="text" id="inputTag" placeholder="Tag">
        
        <button class="add-tag-btn"><span class="material-icons">add</span> Salvar TAG</button>
      </div>
      <div class="modal-footer">
        <button id="btnCancel" class="btn-cancel"><span class="material-icons">block</span> CANCEL</button>
        <button id="btnSave" class="btn-save"><span class="material-icons">save</span> SAVE</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
